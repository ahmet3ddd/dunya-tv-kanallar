name: Haftalık kanal güncellemesi

on:
  schedule:
    - cron: '0 3 * * 1'   # her pazartesi 06:00 (TR)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kanalları denetle ve güncelle
        run: python guncelle.py
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "dunya-tv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kanallar.json durum.json DEGISIKLIKLER.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Haftalık kanal güncellemesi $(date +%F)"
            git push
          fi
      - name: Bildirim (değişiklik varsa)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s degisiklik.txt ]; then
            gh issue create --title "Dünya TV: kanal listesi güncellendi ($(date +%F))" --body-file degisiklik.txt
          fi
